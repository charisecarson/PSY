<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 410" width="360" height="410" class="art" role="img" aria-label="Девушка с хвостиком парит в позе лотоса над подушкой для медитации, рядом цветок и чёрно-белый кот, над головой облачко с сердцем" style="overflow:visible">
  <defs>
    <style>
      :root{
        --white:#FFFFFF;
        --ink:#1C1C1C;
        --graphite:#5B5B58;
        --pencil:#9A9A95;
        --mist:#F0F0EC;
        --mist-2:#E7E7E2;
        --line:#DCDCD7;
        --thread:#2B45E0;
        --thread-soft:#ECEFFD;
        --sans:"Onest",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
        --hand:"Caveat","Segoe Print","Comic Sans MS",cursive;
      }

      .art{
        stroke:var(--ink);
        stroke-width:2.2;
        stroke-linecap:round;
        stroke-linejoin:round;
        fill:none;
      }
      .art .f{fill:var(--white)}
      .art .k{fill:var(--ink)}
      .art .m{fill:var(--mist)}
      .art .t{stroke:var(--thread)}
      .art .thin{stroke-width:1.6}

      .levit{animation:levit 4.6s ease-in-out infinite}
      .levit__sh{
        fill:var(--ink);
        stroke:none;
        opacity:.12;
        transform-box:fill-box;
        transform-origin:center;
        animation:levitSh 4.6s ease-in-out infinite;
      }

      @keyframes levit{
        0%,100%{transform:translateY(-20px)}
        50%{transform:translateY(-30px)}
      }
      @keyframes levitSh{
        0%,100%{transform:scaleX(1);opacity:.14}
        50%{transform:scaleX(.78);opacity:.07}
      }
      @media (prefers-reduced-motion:reduce){
        .levit{animation:none;transform:translateY(-24px)}
        .levit__sh{animation:none}
      }
    </style>
  </defs>

